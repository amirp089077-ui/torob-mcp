[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torob-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Torob (ترب) price comparison and e-commerce intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "amirp089077-ui"}
]
dependencies = []

[project.scripts]
torob-mcp = "torob_mcp.server:main"

[tool.setuptools.packages.find]
include = ["torob_mcp*"]
